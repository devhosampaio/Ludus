<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#302C3D" />
    <meta
      name="description"
      content="Ludus — um espaço para quem vive os videogames."
    />
    <title>Ludus — A casa de quem joga</title>
  </head>
  <body>
    <div id="app">
      <main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#302c3d;color:#f5f0e6;font:16px system-ui,sans-serif;text-align:center">
        <p>Carregando o Ludus…</p>
      </main>
    </div>
    <script>
      window.addEventListener('error', function () {
        var app = document.getElementById('app');
        if (app && app.innerText.includes('Carregando o Ludus')) {
          app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#302c3d;color:#f5f0e6;font:16px system-ui,sans-serif;text-align:center"><p>Não foi possível carregar o Ludus. Verifique sua conexão e tente atualizar a página.</p></main>';
        }
      }, true);
      window.addEventListener('unhandledrejection', function () {
        var app = document.getElementById('app');
        if (app && app.innerText.includes('Carregando o Ludus')) {
          app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#302c3d;color:#f5f0e6;font:16px system-ui,sans-serif;text-align:center"><p>O Ludus não conseguiu iniciar. Tente atualizar a página.</p></main>';
        }
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
