# Rebuilds production and the isolated redesign preview on every main update.
# Preview styling and layout fixes are sourced from redesign/ui-ux-pro-max.
# Latest feed header sticky-position fix included.
# Latest desktop feed/sidebar top alignment fix included.
# Restored full-width review interaction divider.
# Feed header and left sidebar now share the same 24px sticky offset.
# Feed header removed entirely on desktop and mobile.
# Align sidebar top edge with the first feed card.
# Added Avaliar action to desktop side navigation.
# Corrected sidebar/feed alignment by removing the sticky top offset and negative margin.
# Muted favorite and completed status icons to match game-year text color.
# Removed top padding from the desktop left side menu.
# Styled sidebar Avaliar button with white background and separator.
# Moved theme control into the Configurações screen.
# Restored the left sidebar's original top padding.
# Added sidebar notifications shortcut with unread red dot.
# Sidebar sticky offset now matches its initial top position (26px).
name: Deploy Ludus to GitHub Pages
# Preview refresh: remove bookmark button from review cards
# Preview refresh: restore sidebar container padding and align brand
# Preview refresh: Avaliar button white background and centered content
# Preview refresh: increase spacing above sidebar Avaliar button
# Preview refresh: align sidebar navigation top with feed column

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm install

      - name: Build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Checkout redesign preview
        uses: actions/checkout@v5
        with:
          ref: redesign/ui-ux-pro-max
          path: redesign-preview

      - name: Install preview dependencies
        run: npm install --prefix redesign-preview

      - name: Build redesign preview
        run: npm run build --prefix redesign-preview -- --base=/Ludus/preview/ --outDir=../dist/preview
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
