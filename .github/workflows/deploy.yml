# Rebuilds production and the isolated redesign preview on every main update.
# Preview styling and layout fixes are sourced from redesign/ui-ux-pro-max.
# Latest feed header sticky-position fix included.
# Latest desktop feed/sidebar top alignment fix included.
# Restored full-width review interaction divider.
# Feed header and left sidebar now share the same 24px sticky offset.
# Header scrolls with the feed; desktop hamburger hidden, mobile retained.
name: Deploy Ludus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm install

      - name: Build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Checkout redesign preview
        uses: actions/checkout@v5
        with:
          ref: redesign/ui-ux-pro-max
          path: redesign-preview

      - name: Install preview dependencies
        run: npm install --prefix redesign-preview

      - name: Build redesign preview
        run: npm run build --prefix redesign-preview -- --base=/Ludus/preview/ --outDir=../dist/preview
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
